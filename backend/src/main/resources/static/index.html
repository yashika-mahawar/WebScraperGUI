<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartScrape Pro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #191970;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
        }

        #scrapeBtn {
            background: #191970;
            color: white;
        }

        #clearBtn {
            background: #ddd;
        }

        #exportBtn {
            background: #198754;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            margin-top: 20px;
            font-weight: bold;
        }

        .stats {
            margin: 15px 0;
            font-size: 16px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #191970;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>SMARTSCRAPE PRO</h1>

    <p class="subtitle">
        Web Scraping Tool
    </p>

    <div class="card">

        <label for="url">
            Website URL
        </label>

        <input
                id="url"
                type="text"
                placeholder="https://quotes.toscrape.com/"
                value="https://quotes.toscrape.com/"
        >

        <button id="scrapeBtn">
            Scrape Data
        </button>

        <button id="clearBtn">
            Clear
        </button>

        <button id="exportBtn">
            Export CSV
        </button>

        <div class="status" id="status"></div>

        <div class="stats">
            Total Quotes:
            <strong id="total">0</strong>
        </div>

        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>Quote</th>
                    <th>Author</th>
                </tr>

                </thead>

                <tbody id="results"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

    let scrapedData = [];

    const urlInput = document.getElementById("url");
    const scrapeBtn = document.getElementById("scrapeBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");

    const status = document.getElementById("status");
    const total = document.getElementById("total");
    const results = document.getElementById("results");


    scrapeBtn.addEventListener("click", async () => {

        const url = urlInput.value.trim();

        if (!url) {

            status.textContent = "Please enter a URL.";

            return;
        }

        status.textContent = "Scraping...";

scrapeBtn.disabled = true;
        try {

            const response = await fetch(
                `/api/scrape?url=${encodeURIComponent(url)}`
            );

            if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error || "Scraping failed");
}

            scrapedData = await response.json();
            results.innerHTML = "";

            total.textContent = scrapedData.length;

            scrapedData.forEach(item => {

                const row = document.createElement("tr");

                const quoteCell = document.createElement("td");
                quoteCell.textContent = item.text;

                const authorCell = document.createElement("td");
                authorCell.textContent = item.author;

                row.appendChild(quoteCell);
                row.appendChild(authorCell);

                results.appendChild(row);

            });

            status.textContent =
                `Successfully scraped ${scrapedData.length} quotes.`;

        } catch (error) {

            status.textContent =
                "Error: Unable to scrape this website.";

        }finally {
    scrapeBtn.disabled = false;
}

    });


    clearBtn.addEventListener("click", () => {

        urlInput.value = "";

        results.innerHTML = "";

        total.textContent = "0";

        status.textContent = "";

        scrapedData = [];

    });


    exportBtn.addEventListener("click", () => {

        if (scrapedData.length === 0) {

            alert("No data available to export.");

            return;
        }

        let csv = "Quote,Author\n";

        scrapedData.forEach(item => {

            const quote =
                `"${item.text.replace(/"/g, '""')}"`;

            const author =
                `"${item.author.replace(/"/g, '""')}"`;

            csv += `${quote},${author}\n`;

        });

        const blob = new Blob(
            [csv],
            { type: "text/csv" }
        );

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download = "scraped_quotes.csv";

        link.click();

    });

</script>

</body>

</html>
